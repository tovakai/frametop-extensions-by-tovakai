name: Extensions offline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: |
          python -m compileall -q sdk plugins tools tests apps
      - name: Syntax-check standalone OpenVR toolbar against pinned Valve header
        if: matrix.python-version == '3.12'
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            https://raw.githubusercontent.com/ValveSoftware/openvr/v2.15.6/headers/openvr.h \
            --output "${RUNNER_TEMP}/openvr.h"
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I"${RUNNER_TEMP}" \
            plugins/spatial-toolbar/toolbar.cpp
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Plugin discovery
        run: python tools/list_extensions.py

  popup-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install original Pango/Cairo rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-cairo gir1.2-pango-1.0
      - name: Render salvaged Displays popup with system Python
        run: |
          mkdir -p "${RUNNER_TEMP}/toolbar-popup"
          /usr/bin/python3 plugins/spatial-toolbar/menu.py render --dir "${RUNNER_TEMP}/toolbar-popup"
          /usr/bin/python3 plugins/spatial-toolbar/menu.py render --kind toolbar --dir "${RUNNER_TEMP}/toolbar-popup"
          /usr/bin/python3 -c '
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"])/"toolbar-popup"
          fields=(p/"popup.txt").read_text().splitlines()[0].split()
          assert fields[:2]==["popup","profiles"], fields
          width,height=int(fields[3]),int(fields[4])
          assert len((p/"popup.rgba").read_bytes())==width*height*4
          assert "popup:profiles" not in (p/"popup.txt").read_text()
          assert (p/"layout.txt").exists()
          print("Legacy Displays popup rendered OK:",width,"x",height)
          '
