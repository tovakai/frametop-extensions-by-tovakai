name: Extensions offline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: |
          python -m compileall -q sdk plugins tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Plugin discovery
        run: python tools/list_extensions.py

  native-syntax:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned OpenVR v2.15.6 header
        run: |
          cd plugins/spatial-room/native
          mkdir -p build/include
          curl -fsSL https://raw.githubusercontent.com/ValveSoftware/openvr/v2.15.6/headers/openvr.h -o build/include/openvr.h
          echo '1e6ed57199896cc1f7c5484e50fa18955e97be15be690beb28d998c877ead7fd  build/include/openvr.h' | sha256sum -c -
      - name: Check native OpenVR frontend against SDK
        run: |
          cd plugins/spatial-room/native
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wno-unused-parameter -Ibuild/include -fsyntax-only ft-room-vr.cpp
